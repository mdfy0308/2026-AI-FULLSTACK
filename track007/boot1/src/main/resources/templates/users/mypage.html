<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
	layout:decorate="~{fragments/layout}">
<body>
	<div layout:fragment="content">
		<div class="container">
			<h2 class="mb-4">마이페이지</h2>
			<!-- 알림메시지 -->
			<div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
				<span th:text="${successMessage}"></span>
				<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
			</div>
			<div th:if="${errorMessage}" class="alert alert-warning alert-dismissible fade show" role="alert">
				<span th:text="${errorMessage}"></span>
				<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
			</div>
			
			<!-- 로그인된 사용자 -->
			<div sec:authorize="isAuthenticated()">
				<div class="p-3">
					<table class="table table-bordered align-middle">
						<tbody>
							<tr>
								<td rowspan="4" class="text-center fw-bold fs-3 table-primary" style="width: 25%;">
									<img th:if="${dto.ufile != null and #strings.startsWith(dto.ufile,'http')}" th:src="${dto.ufile}" class="w-100" />
									<img th:if="${dto.ufile != null and !#strings.startsWith(dto.ufile,'http')}" th:src="@{|/upload/${dto.ufile}|}" alt="" class="w-100" />
									<img th:unless="${dto.ufile != null}" th:src="@{/upload/the703.png}" alt="" class="w-75" />
								</td>
							</tr>
							<tr>
								<th>닉네임</th>
								<td th:text="${dto.nickname}"></td>
							</tr>
							<tr>
								<th>휴대폰</th>
								<td th:text="${dto.mobile}"></td>
							</tr>
							<tr>
								<th>소셜로그인</th>
								<td th:text="${dto.provider}"></td>
							</tr>
						</tbody>
					</table>
				</div>
				<div class="mt-3 pe-3">
					<!-- 로컬 계정만 정보 수정 버튼 표시 -->
					<div th:if="${dto != null and dto.provider == 'the703'}" class="d-flex justify-content-end">
						<a th:href="@{/users/update}" class="btn btn-primary">정보 수정</a>
						<a th:href="@{/users/delete}" class="btn btn-danger ms-1">회원 탈퇴</a>
						<!-- <form th:action = "@{/users/delete}" method="post">
							<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
							<button type="submit" class="btn btn-danger ms-1">회원 탈퇴</button>
						</form> -->
					</div>
	
					<!-- 소셜 계정은 탈퇴만 가능 -->
					<div class="ms-2" th:if="${dto != null and dto.provider != 'the703'}">
						<form th:action = "@{/users/delete}" method="post">
							<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
							<button type="submit" class="btn btn-danger">회원 탈퇴</button>
						</form>
					</div>
				</div>
			</div>
			
			<!-- 익명 사용자 -->
			<div sec:authorize="isAnonymous()">
				<p class="alert alert-warning">로그인 후 사용 가능한 페이지입니다.</p>
				<a class="btn btn-primary">로그인</a>
			</div>
		</div>
	</div>
</body>
</html>
