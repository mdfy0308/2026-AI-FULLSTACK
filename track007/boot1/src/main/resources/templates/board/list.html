<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{fragments/layout}">
<!--    #1. layout 렌더링    -->
<head lang="ko">
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<div layout:fragment="content">
		<!-- 기능 성공 여부(글쓰기) -->
		<div th:if="${success}"
			class="alert alert-success alert-dismissible fade show" role="alert">
			<span th:text="${success}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"
				aria-label="Close"></button>
		</div>

		<div class="card my-5 p-4">
			<h3 class="card-header">MBTI QUEST BOARD</h3>
			<!-- <div th:text="${paging}"></div>
			<br />
			<div th:text="${list}"></div> -->
			<table class="table table-striped table-bordered table-hover">
				<caption>mbti</caption>
				<thead>
					<tr>
						<th scope="col">NO</th>
						<th scope="col">TITLE</th>
						<th scope="col">NAME</th>
						<th scope="col">DATE</th>
						<th scope="col">HIT</th>
					</tr>
				</thead>
					<!-- UtilPaging(listtotal=8, onepagelist=10, pagetotal=1, bottomlist=10, pstartno=1, current=1, start=1, end=1) -->
					<tr th:each="dto, i: ${list}">
						<td th:text="${paging.listtotal - ((paging.current-1)*paging.onepagelist)-i.index}"></td>
						<td>
							<a th:href="@{/board/detail(id=${dto.id})}"
							th:text="${dto.btitle}"></a>
						</td>
						<td th:text="${dto.appUserId}"></td>
						<td th:text="${dto.createdAt}"></td>
						<td th:text="${dto.bhit}"></td>
					</tr>
				</tbody>
			</table>
			<div>
				<ul class="pagination justify-content-center">
					<!-- 이전 11 -->
					<li th:if="${ paging.start > 1 }" class="page-item">
						<a th:href="@{/board/list(pageNo=${paging.start-1})}" class="page-link">이전</a>
					</li>
					
					<!-- 1 ~ 10 -->
					<li class="page-item"
						th:each="pageNum :${#numbers.sequence(paging.start, paging.end)}"
						th:classappend="${pageNum == paging.current} ? 'active' ">
						<a class="page-link" th:text="${pageNum}"
						th:href="@{/board/list(pageNo=${pageNum})}"></a></li>
						
					<!-- 다음 -->
					<li th:if="${paging.end < paging.pagetotal }" class="page-item">
						<a th:href="@{/board/list(pageNo=${paging.start + paging.bottomlist})}" class="page-link">다음</a>
					</li>

				</ul>
			</div>
	
			<p class="text-end">
				<a th:href="@{/board/write}" class="btn btn-primary">글쓰기</a>
			</p>
			<p class="text-end alert alert-primary">로그인을 하면 글쓰기가능합니다.</p>
		</div>

	</div>
</body>
</html>
